# Default values for test.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: 624858524005.dkr.ecr.ap-south-1.amazonaws.com/sample-app
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "209"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets:
  - name: ecr-secret   # ← fixed: added ECR pull secret for private registry access

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080
  targetPort: 8080

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: true
  className: "alb"
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # alb.ingress.kubernetes.io/scheme: internal              # uncomment for internal ALB
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]' # uncomment for HTTPS
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:REGION:ACCOUNT:certificate/CERT-ID  # uncomment for HTTPS
  hosts:
    - host: ""       # leave empty — ALB will assign DNS automatically 
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls      # uncomment for TLS
  #    hosts:
  #      - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    sectionName: http
  hostnames:
  - chart-example.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# ← DISABLED for debugging: probes were killing pod before we could investigate the 500 error
# ← TO RE-ENABLE: replace the {} below with the full probe config once the issue is resolved
livenessProbe: {}
# livenessProbe:
#   httpGet:
#     path: /health    # tests real app health endpoint
#     port: 8080
#   initialDelaySeconds: 10   # wait 10s before first check (app startup time)
#   periodSeconds: 10         # check every 10s
#   timeoutSeconds: 1         # fail if no response within 1s
#   failureThreshold: 3       # restart pod after 3 consecutive failures

readinessProbe: {}
# readinessProbe:
#   httpGet:
#     path: /health    # tests real app health endpoint
#     port: 8080
#   initialDelaySeconds: 5    # wait 5s before first check (less than liveness)
#   periodSeconds: 10         # check every 10s
#   timeoutSeconds: 1         # fail if no response within 1s
#   failureThreshold: 3       # remove from service after 3 consecutive failures

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []

# -- Node Selector
# Schedule pods only on nodes with specific labels
# How it works: Kubernetes will only place pods on nodes that match ALL labels specified here
# Use case: Run app only on specific node groups (e.g. application nodes, not system nodes)
# More info: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
nodeSelector: {}
  #alpha.eksctl.io/nodegroup-name: ng-default   # ← correct: matches your actual EKS node group

# -- Tolerations
# Allow pods to be scheduled on tainted nodes
tolerations:
  - key: "spot"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"

# -- Affinity
# Advanced pod scheduling rules
affinity:
  # nodeAffinity: Schedule pods only on nodes in specific availability zones
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: topology.kubernetes.io/zone
          operator: In
          values:
          - ap-south-1a   # matches your node ip-192-168-22-118
          - ap-south-1b   # matches your node ip-192-168-39-187

  # podAntiAffinity: Spread pods across different nodes to avoid single point of failure
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - kubernates-demo-test
        topologyKey: kubernetes.io/hostname