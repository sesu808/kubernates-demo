# Default values for test.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: 624858524005.dkr.ecr.ap-south-1.amazonaws.com/sample-app
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "v7d750a7"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080
  targetPort: 8080
  #containerPort: 8080   # whatever the key is in your values.yaml

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
     # added — must match app port

ingress:
  enabled: true
  className: "alb"
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-port: "8080"          # added
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'    # added
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=10
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
          # pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /health    # changed from / to /health — tests real app health endpoint
    port: 8080
  initialDelaySeconds: 10   # wait 10s before first check (app startup time)
  periodSeconds: 10         # check every 10s
  timeoutSeconds: 1         # fail if no response within 1s
  failureThreshold: 3       # restart pod after 3 consecutive failures

readinessProbe:
  httpGet:
    path: /health    # changed from / to /health — tests real app health endpoint
    port: 8080
  initialDelaySeconds: 5    # wait 5s before first check (less than liveness)
  periodSeconds: 10         # check every 10s
  timeoutSeconds: 1         # fail if no response within 1s
  failureThreshold: 3       # remove from service after 3 consecutive failures

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# -- Node Selector
# Schedule pods only on nodes with specific labels
# How it works: Kubernetes will only place pods on nodes that match ALL labels specified here
# Use case: Run app only on specific node groups (e.g. application nodes, not system nodes)
# More info: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
nodeSelector:
  # Schedule pods only on nodes belonging to ng-default nodegroup
  alpha.eksctl.io/nodegroup-name: ng-default
  # -- Other examples (uncomment to use):
  # node-type: application          # custom label on node
  # kubernetes.io/arch: amd64       # only run on amd64 architecture nodes
  # node.kubernetes.io/instance-type: t3.medium  # only run on t3.medium instances

# -- Tolerations
# Allow pods to be scheduled on tainted nodes
# How it works: If a node has a taint, only pods with matching toleration can be scheduled on it
# Use case: Allow app to run on spot instances or dedicated nodes that have taints
# More info: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
tolerations:
  # Tolerate spot instance nodes (AWS spot instances are often tainted)
  - key: "spot"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"
  # -- Other examples (uncomment to use):
  # - key: "dedicated"              # tolerate dedicated nodes
  #   operator: "Equal"
  #   value: "application"
  #   effect: "NoSchedule"
  #
  # - key: "node.kubernetes.io/not-ready"   # tolerate temporarily not-ready nodes
  #   operator: "Exists"
  #   effect: "NoExecute"
  #   tolerationSeconds: 300

# -- Affinity
# Advanced pod scheduling rules — more powerful than nodeSelector
# How it works: Define rules for where pods CAN or CANNOT be scheduled
# Two types:
#   nodeAffinity    — which NODES the pod can run on
#   podAntiAffinity — ensure pods are spread across different nodes (avoid single point of failure)
# More info: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
affinity:
  # nodeAffinity: Schedule pods only on nodes in specific availability zones
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      # Hard rule — pod MUST be scheduled on nodes matching this
      nodeSelectorTerms:
      - matchExpressions:
        - key: topology.kubernetes.io/zone
          operator: In
          values:
          - ap-south-1a   # allow scheduling in ap-south-1a
          - ap-south-1b   # allow scheduling in ap-south-1b
    # -- Other nodeAffinity examples (uncomment to use):
    # preferredDuringSchedulingIgnoredDuringExecution:
    #   # Soft rule — pod PREFERS nodes matching this but not required
    #   - weight: 1
    #     preference:
    #       matchExpressions:
    #       - key: node-type
    #         operator: In
    #         values:
    #         - application

  # podAntiAffinity: Spread pods across different nodes to avoid single point of failure
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    # Soft rule — PREFER to spread pods across different nodes
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - kubernates-demo-test
        # topology key defines the scope — hostname means each node is unique
        topologyKey: kubernetes.io/hostname
    # -- Other podAntiAffinity examples (uncomment to use):
    # requiredDuringSchedulingIgnoredDuringExecution:
    #   # Hard rule — pods MUST NOT be on the same node
    #   - labelSelector:
    #       matchExpressions:
    #       - key: app.kubernetes.io/name
    #         operator: In
    #         values:
    #         - kubernates-demo-test
    #     topologyKey: kubernetes.io/hostname
